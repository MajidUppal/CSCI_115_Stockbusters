name: Quantamental CI/CD Pipeline

on:
  push:
    branches: [ main, Milestone4 ]
    paths:
      - 'src/quantamental/**'
      - '.github/workflows/quantamental-ci.yml'
  pull_request:
    branches: [ main, Milestone4 ]
    paths:
      - 'src/quantamental/**'

jobs:
  test:
    name: Test Quantamental Module
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/quantamental
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock
        
    - name: Run linting
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
      
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=50
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./src/quantamental/coverage.xml
        flags: quantamental
        name: quantamental-coverage
      continue-on-error: true
      
    - name: Archive coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: src/quantamental/htmlcov/
        
    - name: Test Summary
      run: |
        echo "✅ Tests completed successfully!"
        echo "📊 Coverage report generated"
        
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/quantamental
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        
    - name: Run Black (format check)
      run: |
        black --check . || echo "⚠️ Format issues found (non-blocking)"
      continue-on-error: true
      
    - name: Run isort (import check)
      run: |
        isort --check-only . || echo "⚠️ Import order issues found (non-blocking)"
      continue-on-error: true
      
    - name: Run flake8
      run: |
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Build Success
      run: |
        echo "🎉 =================================="
        echo "✅ All CI checks passed!"
        echo "✅ Tests: PASSED"
        echo "✅ Linting: PASSED"
        echo "✅ Coverage: >50%"
        echo "🎉 =================================="
