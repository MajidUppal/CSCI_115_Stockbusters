# GitHub Actions CI/CD Pipeline for RAG Component
# Based on cheese-app-ci-cd best practices
# Runs on every push and pull request to RAG code
# All tests run inside Docker container for consistency

name: RAG CI Pipeline

# Prevent multiple workflows from running simultaneously for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'src/rag/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'src/rag/**'
    branches: [main, develop]
  workflow_dispatch:  # Allow manual triggering

# Set default permissions
permissions:
  contents: read
  pull-requests: read

jobs:
  # Job 1: Build Docker image (shared across all jobs)
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy secrets if needed
        run: |
          mkdir -p secrets
          if [ ! -f secrets/gcs-key.json ]; then
            echo '{}' > secrets/gcs-key.json
          fi

      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/rag/Dockerfile
          push: false
          tags: rag-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1
      
      - name: Verify Docker image
        run: |
          # Verify the image was built and contains expected files
          docker run --rm rag-service:${{ github.sha }} ls -la /workspace/rag.py || exit 1
          docker run --rm rag-service:${{ github.sha }} python --version || exit 1
          echo "✅ Docker image verified successfully"
      
      - name: Save Docker image
        run: |
          docker save rag-service:${{ github.sha }} -o /tmp/rag-service.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/rag-service.tar
          retention-days: 1

  # Job 2: Run linting and formatting checks
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/rag-service.tar

      - name: Run Black formatter check
        run: |
          docker run --rm rag-service:${{ github.sha }} black --check --line-length 120 rag.py rag_helpers.py tests/
        continue-on-error: false

      - name: Run Flake8 linter
        run: |
          docker run --rm rag-service:${{ github.sha }} flake8 --max-line-length=120 --extend-ignore=E203,W503,E501 rag.py rag_helpers.py
        continue-on-error: true

  # Job 3: Run unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/rag-service.tar

      - name: Run unit tests
        run: |
          docker run --rm rag-service:${{ github.sha }} pytest tests/unit/ -v --tb=short -m unit --maxfail=5
        env:
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          VECTOR_COLLECTION: test_collection
          GCS_BUCKET_NAME: ""
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          ENABLE_CACHE: "0"
          AUTO_START_CHROMADB: "0"
          GOOGLE_APPLICATION_CREDENTIALS: ""
        timeout-minutes: 10

      - name: Generate coverage report
        run: |
          docker run --rm -v ${{ github.workspace }}/coverage:/workspace/coverage rag-service:${{ github.sha }} pytest tests/unit/ --cov=rag --cov=rag_helpers --cov-report=term --cov-report=xml --cov-report=html:coverage -m unit --maxfail=5
        env:
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          VECTOR_COLLECTION: test_collection
          GCS_BUCKET_NAME: ""
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          ENABLE_CACHE: "0"
          AUTO_START_CHROMADB: "0"
          GOOGLE_APPLICATION_CREDENTIALS: ""
        continue-on-error: true
        timeout-minutes: 10

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-unit
          path: coverage/
        if: always()

  # Job 4: Run integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/rag-service.tar

      - name: Run integration tests
        run: |
          docker run --rm rag-service:${{ github.sha }} pytest tests/integration/ -v --tb=short -m integration --maxfail=5
        env:
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          VECTOR_COLLECTION: test_collection
          GCS_BUCKET_NAME: ""
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          ENABLE_CACHE: "0"
          AUTO_START_CHROMADB: "0"
          GOOGLE_APPLICATION_CREDENTIALS: ""
        timeout-minutes: 8

  # Job 5: Run system tests
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image and start server
        run: |
          # Load image
          docker load -i /tmp/rag-service.tar
          # Start server immediately after load (no need to wait)
          docker run -d --name rag-server -p 9000:9000 -p 8000:8000 \
            -e DEV=1 \
            -e AUTO_START_CHROMADB=0 \
            -e GCS_BUCKET_NAME="" \
            -e VECTOR_COLLECTION=test_collection \
            -e EMBEDDING_MODEL=BAAI/bge-small-en-v1.5 \
            -e ENABLE_CACHE=0 \
            rag-service:${{ github.sha }}
          echo "Server container started, beginning health checks..."

      - name: Wait for server to be ready
        run: |
          echo "Waiting for RAG server to start..."
          # Use shorter sleep (1s) and fewer retries (10) with curl timeout
          for i in {1..10}; do
            # Use curl with short timeout to fail fast if server not responding
            if curl -f -s --max-time 2 --connect-timeout 1 http://localhost:9000/health > /dev/null 2>&1; then
              echo "✅ Server is ready after $i attempts!"
              exit 0
            fi
            echo "Attempt $i/10: Server not ready yet, waiting 1s..."
            sleep 1
          done
          echo "❌ Server failed to start within 10 seconds"
          echo "Server logs:"
          docker logs rag-server || true
          exit 1

      - name: Run system tests
        run: |
          docker run --rm --network host rag-service:${{ github.sha }} pytest tests/system/ -v --tb=short -m system --maxfail=3 -x
        env:
          API_BASE_URL: http://localhost:9000
        timeout-minutes: 5

      - name: Show server logs
        if: always()
        run: |
          docker logs rag-server || true

      - name: Stop server container
        if: always()
        run: |
          docker stop rag-server || true
          docker rm rag-server || true

  # Job 6: Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests]
    if: always()
    steps:
      - name: Check test results
        id: test-results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "System Tests: ${{ needs.system-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" != "success" ] || [ "${{ needs.integration-tests.result }}" != "success" ] || [ "${{ needs.system-tests.result }}" != "success" ]; then
            echo "❌ Some tests failed!"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All tests passed!"
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Print summary
        run: |
          echo "## RAG CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| System Tests | ${{ needs.system-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint-and-format.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
      
      - name: Check if Slack webhook is configured
        id: slack-check
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: always() && steps.slack-check.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ steps.test-results.outputs.status == 'success' && '✅ RAG CI Pipeline Passed' || '❌ RAG CI Pipeline Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.test-results.outputs.status == 'success' && '✅ RAG CI Pipeline Passed' || '❌ RAG CI Pipeline Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Results:*\n• Unit Tests: ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}\n• Integration Tests: ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}\n• System Tests: ${{ needs.system-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}\n• Lint & Format: ${{ needs.lint-and-format.result == 'success' && '✅ Passed' || '❌ Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.head_commit.url }}|View Commit> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
