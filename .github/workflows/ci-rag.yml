# GitHub Actions CI/CD Pipeline for RAG Component
# Based on cheese-app-ci-cd best practices
# Runs on every push and pull request to RAG code
# All tests run inside Docker container for consistency

name: RAG CI Pipeline
# Uses GitHub Container Registry (GHCR) for Docker images
# GHCR has separate 500GB storage quota and is designed for Docker images
# Coverage percentage is extracted and displayed in GitHub Actions Summary
# Coverage reports are committed to coverage/ folder in the repository

# Prevent multiple workflows from running simultaneously for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'src/rag/**'
      - '.github/workflows/ci-rag.yml'  # Trigger when workflow file changes
    branches: [main, develop, Milestone4]
  pull_request:
    paths:
      - 'src/rag/**'
      - '.github/workflows/ci-rag.yml'  # Trigger when workflow file changes
    branches: [main, develop, Milestone4]
  workflow_dispatch:  # Allow manual triggering

# Set default permissions
permissions:
  contents: write  # Required for committing coverage reports
  pull-requests: write  # Required for posting PR comments
  packages: write  # Required for pushing to GHCR

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase repository names - convert github.repository to lowercase
  IMAGE_NAME: ${{ github.repository }}/rag-service

jobs:
  # Job 1: Build Docker image and push to GHCR
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      packages: write  # Required for pushing to GHCR
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT
          echo "Full image name: ${{ env.REGISTRY }}/$IMAGE_NAME_LOWER"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create dummy secrets
        run: |
          mkdir -p secrets
          if [ ! -f secrets/gcs-key.json ]; then
            echo '{}' > secrets/gcs-key.json
          fi

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ./src/rag/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILDKIT: 1
        timeout-minutes: 10  # Increased for full rebuilds without cache

      - name: Verify image was pushed
        run: |
          echo "✅ Image pushed to GHCR: ${{ steps.meta.outputs.tags }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # Job 2: Run linting and formatting checks
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }} rag-service:${{ github.sha }}

      - name: Run linting
        run: |
          # Run Black and Flake8 in single container to save startup time
          docker run --rm -e PYTHONPATH="/.venv/lib/python3.12/site-packages:$PYTHONPATH" \
            rag-service:${{ github.sha }} sh -c "black --check --line-length 120 rag.py && flake8 --max-line-length=120 --extend-ignore=E203,W503,E501,E722,W504,E402,F401,F841,F811,F821 rag.py" || exit_code=$?
          if [ ${exit_code:-0} -ne 0 ]; then
            echo "⚠️ Linting failed"
            exit ${exit_code}
          fi
        continue-on-error: false
        timeout-minutes: 2

  # Job 3: Run unit tests
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    outputs:
      coverage_percentage: ${{ steps.extract-coverage.outputs.coverage }}
      branch_coverage: ${{ steps.extract-coverage.outputs.branch_coverage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }} rag-service:${{ github.sha }}

      - name: Run tests
        run: |
          mkdir -p src/rag/coverage
          docker run --rm -v ${{ github.workspace }}/src/rag/coverage:/workspace/coverage \
            -e PYTHONPATH="/.venv/lib/python3.12/site-packages:$PYTHONPATH" \
            rag-service:${{ github.sha }} \
            pytest tests/unit/ --cov=rag --cov-report=term --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/htmlcov --cov-fail-under=50 -m unit --maxfail=2 -x --tb=line -q || exit_code=$?
          exit ${exit_code:-0}
        env:
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          VECTOR_COLLECTION: test_collection
          GCS_BUCKET_NAME: ""
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          ENABLE_CACHE: "0"
          AUTO_START_CHROMADB: "0"
          GOOGLE_APPLICATION_CREDENTIALS: ""
        continue-on-error: false
        timeout-minutes: 4

      - name: Extract coverage percentage
        id: extract-coverage
        if: always()
        # Extract coverage percentage from the XML file generated by pytest
        run: |
          COVERAGE_XML="src/rag/coverage/coverage.xml"
          
          if [ -f "$COVERAGE_XML" ]; then
            COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('$COVERAGE_XML'); root = tree.getroot(); print(f\"{int(float(root.get('line-rate', 0)) * 100)}%\")" 2>/dev/null || echo "N/A")
            BRANCH_COV=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('$COVERAGE_XML'); root = tree.getroot(); print(f\"{int(float(root.get('branch-rate', 0)) * 100)}\")" 2>/dev/null || echo "N/A")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "branch_coverage=$BRANCH_COV" >> $GITHUB_OUTPUT
            echo "✅ Coverage extracted: $COVERAGE"
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
            echo "branch_coverage=N/A" >> $GITHUB_OUTPUT
            echo "⚠️ Coverage XML not found"
          fi

      - name: Commit coverage reports to repo
        if: always() && github.event_name == 'push'
        # Commit coverage files to coverage/ folder at repo root
        # This path won't trigger the workflow (outside src/rag/)
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create coverage directory at repo root
          mkdir -p coverage
          
          # Copy coverage files to root coverage folder
          if [ -f "src/rag/coverage/coverage.xml" ]; then
            cp src/rag/coverage/coverage.xml coverage/
            echo "✅ Copied coverage.xml"
          fi
          
          if [ -d "src/rag/coverage/htmlcov" ]; then
            cp -r src/rag/coverage/htmlcov coverage/
            echo "✅ Copied HTML coverage report"
          fi
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain coverage/)" ]; then
            git add coverage/
            git commit -m "Update coverage reports [skip ci]" || exit 0
            git push || echo "⚠️ Failed to push coverage files (may not have write access)"
            echo "✅ Coverage reports committed to coverage/ folder"
          else
            echo "ℹ️ No coverage files to commit"
          fi
        continue-on-error: true

  # Job 4: Run integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }} rag-service:${{ github.sha }}

      - name: Run tests
        run: |
          docker run --rm -e PYTHONPATH="/.venv/lib/python3.12/site-packages:$PYTHONPATH" \
            rag-service:${{ github.sha }} pytest tests/integration/ --tb=line -m integration --maxfail=1 -x -q
        env:
          CHROMADB_HOST: localhost
          CHROMADB_PORT: "8000"
          VECTOR_COLLECTION: test_collection
          GCS_BUCKET_NAME: ""
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          ENABLE_CACHE: "0"
          AUTO_START_CHROMADB: "0"
          GOOGLE_APPLICATION_CREDENTIALS: ""
        timeout-minutes: 2

  # Job 5: Run system tests
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    # Skip system tests on feature branches for speed - only run on main branches
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/Milestone4' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT

      - name: Pull Docker image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ github.sha }} rag-service:${{ github.sha }}

      - name: Start server
        run: |
          docker run -d --name rag-server -p 9000:9000 -p 8000:8000 \
            -e DEV=1 \
            -e AUTO_START_CHROMADB=0 \
            -e GCS_BUCKET_NAME="" \
            -e VECTOR_COLLECTION=test_collection \
            -e EMBEDDING_MODEL=BAAI/bge-small-en-v1.5 \
            -e ENABLE_CACHE=0 \
            rag-service:${{ github.sha }}
        timeout-minutes: 1

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to be ready (up to 20 seconds)..."
          for i in {1..10}; do
            if curl -f -s --max-time 2 http://localhost:9000/health > /dev/null 2>&1; then
              echo "✅ Server is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/10: Server not ready yet, waiting 2 seconds..."
            sleep 2
          done
          echo "❌ Server failed to become ready after 10 attempts (20 seconds)"
          echo "=== Server logs (last 50 lines) ==="
          docker logs rag-server --tail 50 || true
          exit 1
        timeout-minutes: 1

      - name: Run system tests
        run: |
          docker run --rm --network host -e PYTHONPATH="/.venv/lib/python3.12/site-packages:$PYTHONPATH" \
            rag-service:${{ github.sha }} pytest tests/system/ --tb=line -m system --maxfail=1 -x -q
        env:
          API_BASE_URL: http://localhost:9000
        timeout-minutes: 2

      - name: Show server logs
        if: always()
        run: |
          docker logs rag-server || true

      - name: Stop server container
        if: always()
        run: |
          docker stop rag-server || true
          docker rm rag-server || true

  # Job 6: Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build, lint-and-format, unit-tests, integration-tests, system-tests]
    if: always()
    steps:
      - name: Get coverage from job output
        id: coverage
        # Coverage percentage is already extracted in the unit-tests job
        # We just need to pass it through for use in the summary
        run: |
          COVERAGE="${{ needs.unit-tests.outputs.coverage_percentage }}"
          BRANCH_COV="${{ needs.unit-tests.outputs.branch_coverage }}"
          
          if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "N/A" ]; then
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "branch_coverage=$BRANCH_COV" >> $GITHUB_OUTPUT
            echo "coverage_source=JobOutput" >> $GITHUB_OUTPUT
            echo "✅ Coverage from unit-tests job: $COVERAGE"
          else
            echo "coverage=See Terminal" >> $GITHUB_OUTPUT
            echo "coverage_source=Terminal" >> $GITHUB_OUTPUT
            echo "⚠️ Coverage not available from job output"
            echo "📋 Coverage percentage is shown in the Unit Tests job terminal output"
          fi

      - name: Check test results
        id: test-results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "System Tests: ${{ needs.system-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" != "success" ] || [ "${{ needs.integration-tests.result }}" != "success" ] || [ "${{ needs.system-tests.result }}" != "success" ]; then
            echo "❌ Some tests failed!"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All tests passed!"
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Post coverage report to PR
        if: github.event_name == 'pull_request' && steps.coverage.outputs.coverage_source == 'JobOutput'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = `${{ steps.coverage.outputs.coverage }}`;
            const branchCov = `${{ steps.coverage.outputs.branch_coverage }}`;
            
            const body = `## 📊 Coverage Report
            
            ### Coverage Metrics
            - **Line Coverage**: ${coverage}
            ${branchCov && branchCov !== 'N/A' ? `- **Branch Coverage**: ${branchCov}%` : ''}
            - **Minimum Required**: 50%
            
            📋 Coverage details are available in the Unit Tests job terminal output.
            
            ---
            *Report generated for commit: \`${context.sha.substring(0, 7)}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        continue-on-error: true

      - name: Print summary
        run: |
          echo "## 📊 RAG CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Coverage Section
          echo "### 📈 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.coverage.outputs.coverage }}" != "See Terminal" ] && [ "${{ steps.coverage.outputs.coverage }}" != "N/A" ]; then
            echo "**Coverage: ${{ steps.coverage.outputs.coverage }}** (Minimum required: 50%)" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.coverage.outputs.branch_coverage }}" != "N/A" ] && [ -n "${{ steps.coverage.outputs.branch_coverage }}" ]; then
              echo "**Branch Coverage: ${{ steps.coverage.outputs.branch_coverage }}%**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**Coverage**: See terminal output in Unit Tests job" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 Detailed coverage information is available in the Unit Tests job terminal output." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test Results
          echo "### ✅ Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Lint & Format | ${{ needs.lint-and-format.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ System Tests | ${{ needs.system-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Docker Image
          echo "### 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "**Image**: \`${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Summary
          if [ "${{ steps.test-results.outputs.status }}" = "success" ]; then
            echo "🎉 **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some tests failed.**" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true
        if: always()
      
      - name: Check if Slack webhook is configured
        id: slack-check
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: always() && steps.slack-check.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ steps.test-results.outputs.status == 'success' && '✅ RAG CI Pipeline Passed' || '❌ RAG CI Pipeline Failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.test-results.outputs.status == 'success' && '✅ RAG CI Pipeline Passed' || '❌ RAG CI Pipeline Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Results:*\n• Unit Tests: ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}\n• Integration Tests: ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}\n• System Tests: ${{ needs.system-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}\n• Lint & Format: ${{ needs.lint-and-format.result == 'success' && '✅ Passed' || '❌ Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.event.head_commit.url }}|View Commit> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
