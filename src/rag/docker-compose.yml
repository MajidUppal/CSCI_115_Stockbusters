services:
  rag:
    build: .
    container_name: rag-cli
    env_file:
      - .env
    volumes:
      # Mount the entire repo so in-container paths == repo paths
      - ./:/workspace
    working_dir: /workspace
    ports:
      - "8000:8000"     # API_PORT in .env should be 8000
    command: ["--serve"]  # default: run the API; run ingest as one-off

    # healthcheck (FastAPI /health)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 5

