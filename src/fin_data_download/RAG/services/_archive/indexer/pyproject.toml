[project]
name = "ms2-indexer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "chromadb>=0.5.5",
  "sentence-transformers>=3.0.0",
  "pypdf>=4.0.0",
  "beautifulsoup4>=4.12.0",
]

[tool.uv]
index-strategy = "copy"
